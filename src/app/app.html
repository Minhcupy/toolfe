<div class="app-frame">
  @if (tokens.isAuthenticated()) {
    <header class="topbar">
      <a class="brand" routerLink="/projects" aria-label="VoxFlow dashboard">
        <span class="brand-mark">V</span>
        <span>VoxFlow</span>
      </a>
      <nav aria-label="Điều hướng chính">
        <a routerLink="/projects" routerLinkActive="active">Projects</a>
        <button type="button" class="link-button" (click)="logout()">Đăng xuất</button>
      </nav>
    </header>
  }
  <main [class.authenticated]="tokens.isAuthenticated()">
    <router-outlet />
  </main>
</div>
